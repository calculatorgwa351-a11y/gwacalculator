services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gwa-network

  # PostgreSQL Database (Supabase connection for local dev)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gwacalculator
      POSTGRES_USER: gwauser
      POSTGRES_PASSWORD: gwasecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - gwa-network
    profiles:
      - local-postgres

  # Redis service for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - gwa-network
    profiles:
      - redis

volumes:
  postgres_data:
  redis_data:

networks:
  gwa-network:
    driver: bridge
