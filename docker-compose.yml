services:
  web:
    build: .
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      APP_ENV: ${DOCKER_APP_ENV:-development}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite:////data/gwa_calculator.db}
      SECRET_KEY: ${DOCKER_SECRET_KEY:-local-docker-dev-secret-123456789012345}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${DOCKER_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${DOCKER_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000}
      ALLOWED_HOSTS: ${DOCKER_ALLOWED_HOSTS:-localhost,127.0.0.1}
      COOKIE_SECURE: ${DOCKER_COOKIE_SECURE:-}
      COOKIE_SAMESITE: ${DOCKER_COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${DOCKER_COOKIE_DOMAIN:-}
      INIT_DB_ON_STARTUP: ${DOCKER_INIT_DB_ON_STARTUP:-1}
      SEED_DEMO_DATA: ${DOCKER_SEED_DEMO_DATA:-1}
      DEMO_RESET_PASSWORDS: ${DOCKER_DEMO_RESET_PASSWORDS:-1}
      DEFAULT_ADMIN_SCHOOL_ID: ${DOCKER_DEFAULT_ADMIN_SCHOOL_ID:-admin}
      DEFAULT_ADMIN_NAME: ${DOCKER_DEFAULT_ADMIN_NAME:-Administrator}
      DEFAULT_ADMIN_PASSWORD: ${DOCKER_DEFAULT_ADMIN_PASSWORD:-Strongadminpass123!}
      SUPABASE_SSL_NO_VERIFY: ${DOCKER_SUPABASE_SSL_NO_VERIFY:-0}
      DB_POOL_SIZE: ${DOCKER_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DOCKER_DB_MAX_OVERFLOW:-20}
      ALLOW_SQLITE_IN_PRODUCTION: ${DOCKER_ALLOW_SQLITE_IN_PRODUCTION:-0}
      WEB_CONCURRENCY: ${DOCKER_WEB_CONCURRENCY:-1}
    volumes:
      - gwa_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gwa_data:
