services:
  - type: web
    name: gwacalculator
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "6543"
      - key: PGDATABASE
        value: postgres
      - key: SUPABASE_SSL_NO_VERIFY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: gwacalculator-u5pr.onrender.com
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: lax
      - key: ALLOW_SQLITE_IN_PRODUCTION
        value: "0"
      - key: INIT_DB_ON_STARTUP
        value: "1"
      - key: SEED_DEMO_DATA
        value: "0"
      - key: DEFAULT_ADMIN_SCHOOL_ID
        value: admin
      - key: DEFAULT_ADMIN_NAME
        value: Administrator
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEMO_RESET_PASSWORDS
        value: "0"
      - key: STARTUP_BOOTSTRAP_MODE
        value: background
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "180"
      - key: GUNICORN_WORKER_CLASS
        value: "uvicorn.workers.UvicornWorker"
      - key: GUNICORN_MAX_REQUESTS
        value: "1000"
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "50"
