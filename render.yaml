services:
  - type: web
    name: gwacalculator
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_render.py && gunicorn app:app --workers ${WEB_CONCURRENCY:-2} --threads ${WEB_THREADS:-2} --bind 0.0.0.0:${PORT}
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SECRET_KEY
        generateValue: true
      # Supabase PostgreSQL Configuration
      - key: PGUSER
        value: postgres.orzouvypfqrrerciryoy
      - key: PGPASSWORD
        value: VnrPNtYCDjiPDjB5
      - key: PGHOST
        value: aws-1-ap-southeast-2.pooler.supabase.com
      - key: PGPORT
        value: 6543
      - key: PGDATABASE
        value: postgres
      - key: SUPABASE_SSL_NO_VERIFY
        value: 1
