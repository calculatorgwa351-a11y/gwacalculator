services:
  - type: web
    name: gwacalculator
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///gwa_calculator.db
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: gwacalculator-u5pr.onrender.com
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: lax
      - key: INIT_DB_ON_STARTUP
        value: "1"
      - key: SEED_DEMO_DATA
        value: "1"
      - key: DEFAULT_ADMIN_SCHOOL_ID
        value: admin
      - key: DEFAULT_ADMIN_NAME
        value: Administrator
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEMO_RESET_PASSWORDS
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
