services:
  - type: web
    name: gwacalculator
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: INIT_DB_ON_STARTUP
        value: "1"
      - key: SEED_DEMO_DATA
        value: "0"
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
